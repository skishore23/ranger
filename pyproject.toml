[project]
name = "ranger"
version = "0.1.0"
description = "Evidence-first execution engine for stateful agent workflows"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "ai", "workflow", "state-machine", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "networkx>=3.2",
  "python-dotenv>=1.0.0",
  "typer>=0.9.0"
]

[project.urls]
Homepage = "https://github.com/skishore23/ranger"
Documentation = "https://github.com/skishore23/ranger/blob/main/README.md"
Source = "https://github.com/skishore23/ranger"

[project.scripts]
ranger = "ranger.cli:app"

[project.optional-dependencies]
viz = ["graphviz>=0.20"]
dev = [
  "coverage[toml]>=7.0.0",
  "hypothesis>=6.0.0",
  "mypy>=1.8.0",
  "mutmut>=2.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.4.0"
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
