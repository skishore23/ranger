[project]
name = "ranger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "python-dotenv>=1.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "coverage[toml]>=7.0.0",
  "hypothesis>=6.0.0",
  "mutmut>=2.0.0",
  "typer>=0.9.0"
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
